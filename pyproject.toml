[project]
name = "autostats"
version = "0.1.0"
description = "AI agent that automates statistical analyses using an OpenAI LLM and a modular tool library."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pyarrow>=17.0",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30", "sse-starlette>=2.1"]
report-pdf = ["weasyprint>=62.0"]
notebook = ["ipython>=8.26", "nbformat>=5.10"]
timeseries = ["pmdarima>=2.0"]
effect-size = ["pingouin>=0.5"]
data-sources = ["fredapi>=0.5", "wbdata>=1.0", "requests>=2.32", "beautifulsoup4>=4.12", "lxml>=5.2"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.24"]

[project.scripts]
autostats = "autostats.cli.main:app"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
